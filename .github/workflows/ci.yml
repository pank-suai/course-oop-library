name: JVM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Desktop JVM project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run JVM tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build Desktop JVM application
        run: ./gradlew build --no-daemon --stacktrace

      - name: Compile Typst report
        run: ./gradlew :docs:compileTypst --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
