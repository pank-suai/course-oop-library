</defs><rect width="1600" height="900" fill="#fbfdff"/><text x="64" y="54" class="title">Room schema · SQLite tables</text><text x="64" y="82" class="subtitle">Readers and publications form M:N through loans; branches own publications, librarians and loan staff.</text><line x1="64" y1="106" x2="1536" y2="106" stroke="#c8d7e0" stroke-width="1.5"/><path d="M350,330 C430,380 500,475 560,560" class="line" marker-end="url(#arrow)"/><path d="M900,330 C820,380 760,475 720,560" class="line" marker-end="url(#arrow)"/><path d="M1210,310 L950,310" class="line" marker-end="url(#arrow)"/><path d="M1360,395 C1350,470 1280,510 1250,560" class="line" marker-end="url(#arrow)"/><path d="M1090,650 C980,650 900,650 800,650" class="line" marker-end="url(#arrow)"/><text x="385" y="382" class="label">Reader 1 → 0..* Loan</text><text x="745" y="382" class="label">Publication 1 → 0..* Loan</text><text x="1085" y="292" class="label" text-anchor="middle">Branch 1 → 0..* Publication</text><text x="1395" y="475" class="label" text-anchor="middle">Branch 1 → 0..* Librarian</text><text x="945" y="628" class="label" text-anchor="middle">Librarian 1 → 0..* Loan</text><text x="800" y="438" class="node-title" text-anchor="middle">Reader 0..*  ↔  0..* Publication</text><text x="800" y="465" class="node-sub" text-anchor="middle">M:N materialized by Loan</text><rect x="80" y="200" width="300" height="195" rx="12" class="domain"/><text x="98" y="230" class="node-title">readers</text><text x="98" y="254" class="small">Room @Entity</text><line x1="94" y1="270" x2="366" y2="270" stroke="#aac0cc" stroke-width="1.2"/><text x="100" y="295" class="mono">id</text><text x="360" y="295" class="small" text-anchor="end">PK</text><text x="100" y="319" class="mono">fullName</text><text x="360" y="319" class="small" text-anchor="end">TEXT</text><text x="100" y="343" class="mono">birthYear</text><text x="360" y="343" class="small" text-anchor="end">INT</text><text x="100" y="367" class="mono">address</text><text x="360" y="367" class="small" text-anchor="end">TEXT</text><rect x="650" y="200" width="300" height="195" rx="12" class="domain"/><text x="668" y="230" class="node-title">publications</text><text x="668" y="254" class="small">Room @Entity</text><line x1="664" y1="270" x2="936" y2="270" stroke="#aac0cc" stroke-width="1.2"/><text x="670" y="295" class="mono">id</text><text x="930" y="295" class="small" text-anchor="end">PK</text><text x="670" y="319" class="mono">kind</text><text x="930" y="319" class="small" text-anchor="end">DISCRIMINATOR</text><text x="670" y="343" class="mono">title</text><text x="930" y="343" class="small" text-anchor="end">TEXT</text><text x="670" y="367" class="mono">branchId</text><text x="930" y="367" class="small" text-anchor="end">FK</text><text x="670" y="391" class="mono">copies</text><text x="930" y="391" class="small" text-anchor="end">INT</text><rect x="1210" y="200" width="300" height="195" rx="12" class="accent"/><text x="1228" y="230" class="node-title">branches</text><text x="1228" y="254" class="small">Room @Entity</text><line x1="1224" y1="270" x2="1496" y2="270" stroke="#aac0cc" stroke-width="1.2"/><text x="1230" y="295" class="mono">id</text><text x="1490" y="295" class="small" text-anchor="end">PK</text><text x="1230" y="319" class="mono">name</text><text x="1490" y="319" class="small" text-anchor="end">TEXT</text><text x="1230" y="343" class="mono">address</text><text x="1490" y="343" class="small" text-anchor="end">TEXT</text><text x="1230" y="367" class="mono">…</text><text x="1490" y="367" class="small" text-anchor="end">…</text><rect x="500" y="560" width="300" height="195" rx="12" class="rose"/><text x="518" y="590" class="node-title">loans</text><text x="518" y="614" class="small">associative entity</text><line x1="514" y1="630" x2="786" y2="630" stroke="#aac0cc" stroke-width="1.2"/><text x="520" y="655" class="mono">id</text><text x="780" y="655" class="small" text-anchor="end">PK</text><text x="520" y="679" class="mono">readerId</text><text x="780" y="679" class="small" text-anchor="end">FK</text><text x="520" y="703" class="mono">publicationId</text><text x="780" y="703" class="small" text-anchor="end">FK</text><text x="520" y="727" class="mono">librarianId</text><text x="780" y="727" class="small" text-anchor="end">FK</text><text x="520" y="751" class="mono">status</text><text x="780" y="751" class="small" text-anchor="end">TEXT</text><rect x="1090" y="560" width="300" height="195" rx="12" class="storage"/><text x="1108" y="590" class="node-title">librarians</text><text x="1108" y="614" class="small">Room @Entity</text><line x1="1104" y1="630" x2="1376" y2="630" stroke="#aac0cc" stroke-width="1.2"/><text x="1110" y="655" class="mono">id</text><text x="1370" y="655" class="small" text-anchor="end">PK</text><text x="1110" y="679" class="mono">fullName</text><text x="1370" y="679" class="small" text-anchor="end">TEXT</text><text x="1110" y="703" class="mono">position</text><text x="1370" y="703" class="small" text-anchor="end">TEXT</text><text x="1110" y="727" class="mono">branchId</text><text x="1370" y="727" class="small" text-anchor="end">FK</text><rect x="80" y="760" width="1310" height="55" rx="12" class="note"/><text x="105" y="794" class="label">PK = primary key     FK = foreign key     lines show parent 1 → child 0..* cardinality</text><text x="800" y="845" class="small" text-anchor="middle">Foreign keys preserve Reader–Publication history and branch staffing relationships.</text><line x1="64" y1="846" x2="1536" y2="846" stroke="#c8d7e0" stroke-width="1.2"/><rect x="64" y="864" width="14" height="14" rx="3" fill="#e9f4fb" stroke="#17324d" stroke-width="1"/><text x="86" y="876" class="small">Readers / publications</text><rect x="274.0" y="864" width="14" height="14" rx="3" fill="#fff0ef" stroke="#17324d" stroke-width="1"/><text x="296.0" y="876" class="small">Loans / FK association</text><rect x="484.0" y="864" width="14" height="14" rx="3" fill="#edf8f2" stroke="#17324d" stroke-width="1"/><text x="506.0" y="876" class="small">Branches / librarians</text><rect x="687.0" y="864" width="14" height="14" rx="3" fill="#fff5df" stroke="#17324d" stroke-width="1"/><text x="709.0" y="876" class="small">Branch relation</text></svg>