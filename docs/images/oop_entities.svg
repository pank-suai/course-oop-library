<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Domain entity hierarchy</title><desc>Entity hierarchy with real inheritance and Loan-backed many-to-many relation.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#17324d"/></marker>
  <marker id="openArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L13,7 L0,14" fill="#ffffff" stroke="#17324d" stroke-width="1.8"/></marker>
  <marker id="diamond" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,7 L7,1 L13,7 L7,13 z" fill="#ffffff" stroke="#17324d" stroke-width="1.6"/></marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172a3a; }
    .title { font-size: 31px; font-weight: 700; letter-spacing: .1px; }
    .subtitle { font-size: 16px; fill: #516b7d; }
    .section { font-size: 15px; font-weight: 700; letter-spacing: 1.1px; fill: #2c5872; }
    .node-title { font-size: 20px; font-weight: 700; }
    .node-sub { font-size: 15px; fill: #476275; }
    .body { font-size: 15px; }
    .small { font-size: 13px; fill: #476275; }
    .label { font-size: 14px; font-weight: 700; fill: #2c5872; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 14px; }
    .box { fill: #ffffff; stroke: #17324d; stroke-width: 2; }
    .soft { fill: #f5f9fc; stroke: #8ca5b5; stroke-width: 1.5; }
    .domain { fill: #e9f4fb; stroke: #24739b; stroke-width: 2; }
    .control { fill: #f0edfa; stroke: #735a9b; stroke-width: 2; }
    .storage { fill: #edf8f2; stroke: #328366; stroke-width: 2; }
    .accent { fill: #fff5df; stroke: #b87517; stroke-width: 2; }
    .rose { fill: #fff0ef; stroke: #b45b55; stroke-width: 2; }
    .line { fill: none; stroke: #17324d; stroke-width: 2.2; }
    .thin { fill: none; stroke: #7b93a4; stroke-width: 1.6; }
    .dash { fill: none; stroke: #50758b; stroke-width: 1.8; stroke-dasharray: 8 6; }
    .observe { fill: none; stroke: #735a9b; stroke-width: 2.2; stroke-dasharray: 7 5; }
    .note { fill: #f7fbfd; stroke: #9bb2c0; stroke-width: 1.4; }
    .pill { fill: #17324d; }
    .pill-text { fill: #ffffff; font-size: 13px; font-weight: 700; letter-spacing: .7px; }
  </style>
</defs><rect width="1600" height="900" fill="#fbfdff"/><text x="64" y="54" class="title">Domain entity hierarchy</text><text x="64" y="82" class="subtitle">LibraryEntity roots the people, publications, branches and loan relationship.</text><line x1="64" y1="106" x2="1536" y2="106" stroke="#c8d7e0" stroke-width="1.5"/><path d="M420,300 L650,210" class="line" marker-end="url(#openArrow)"/><path d="M1180,300 L950,210" class="line" marker-end="url(#openArrow)"/><path d="M210,520 L300,430" class="line" marker-end="url(#openArrow)"/><path d="M520,520 L500,430" class="line" marker-end="url(#openArrow)"/><path d="M1010,520 L1100,430" class="line" marker-end="url(#openArrow)"/><path d="M1370,520 L1300,430" class="line" marker-end="url(#openArrow)"/><path d="M360,824 L40,824 L40,210 L650,210" class="dash" marker-end="url(#openArrow)"/><path d="M1240,824 L1560,824 L1560,210 L950,210" class="dash" marker-end="url(#openArrow)"/><path d="M480,740 L520,660" class="line" marker-end="url(#arrow)"/><path d="M210,660 C420,680 720,700 970,740" class="line" marker-end="url(#arrow)"/><path d="M1320,430 L1510,430 L1510,700 L1270,740" class="line" marker-end="url(#arrow)"/><text x="468" y="718" class="label">1</text><text x="500" y="690" class="label">0..*</text><text x="535" y="710" class="small">assigned librarians</text><text x="360" y="678" class="label">1</text><text x="900" y="720" class="label">0..*</text><text x="1335" y="455" class="label">1</text><text x="1280" y="710" class="label">0..*</text><text x="70" y="198" class="small">implements</text><text x="1460" y="198" class="small" text-anchor="end">implements</text><rect x="650" y="140" width="300" height="70" rx="14" class="domain"/><text x="800.0" y="172" class="node-title" text-anchor="middle">LibraryEntity</text><text x="800.0" y="197" class="node-sub" text-anchor="middle">interface</text><rect x="260" y="300" width="280" height="130" rx="14" class="domain"/><text x="400.0" y="332" class="node-title" text-anchor="middle">Person</text><text x="400.0" y="357" class="node-sub" text-anchor="middle">sealed interface</text><rect x="1040" y="300" width="280" height="130" rx="14" class="domain"/><text x="1180.0" y="332" class="node-title" text-anchor="middle">Publication</text><text x="1180.0" y="357" class="node-sub" text-anchor="middle">sealed interface</text><rect x="70" y="520" width="280" height="140" rx="14" class="box"/><text x="210.0" y="552" class="node-title" text-anchor="middle">Reader</text><text x="210.0" y="577" class="node-sub" text-anchor="middle">fullName · address</text><rect x="380" y="520" width="280" height="140" rx="14" class="box"/><text x="520.0" y="552" class="node-title" text-anchor="middle">Librarian</text><text x="520.0" y="577" class="node-sub" text-anchor="middle">fullName · position</text><rect x="860" y="520" width="280" height="140" rx="14" class="box"/><text x="1000.0" y="552" class="node-title" text-anchor="middle">Book</text><text x="1000.0" y="577" class="node-sub" text-anchor="middle">title · authors · ISBN</text><rect x="1170" y="520" width="280" height="140" rx="14" class="box"/><text x="1310.0" y="552" class="node-title" text-anchor="middle">Periodical</text><text x="1310.0" y="577" class="node-sub" text-anchor="middle">title · issueNumber</text><rect x="330" y="740" width="300" height="84" rx="14" class="accent"/><text x="480.0" y="772" class="node-title" text-anchor="middle">LibraryBranch</text><text x="480.0" y="797" class="node-sub" text-anchor="middle">name · address</text><rect x="970" y="740" width="300" height="84" rx="14" class="rose"/><text x="1120.0" y="772" class="node-title" text-anchor="middle">Loan</text><text x="1120.0" y="797" class="node-sub" text-anchor="middle">readerId · publicationId</text><text x="800" y="812" class="label" text-anchor="middle">Loan is the associative entity: Reader 0..* ↔ 0..* Publication</text><line x1="64" y1="846" x2="1536" y2="846" stroke="#c8d7e0" stroke-width="1.2"/><rect x="64" y="864" width="14" height="14" rx="3" fill="#e9f4fb" stroke="#17324d" stroke-width="1"/><text x="86" y="876" class="small">Domain entities</text><rect x="225.0" y="864" width="14" height="14" rx="3" fill="#fff0ef" stroke="#17324d" stroke-width="1"/><text x="247.0" y="876" class="small">Association / stateful record</text><rect x="484.0" y="864" width="14" height="14" rx="3" fill="#fff5df" stroke="#17324d" stroke-width="1"/><text x="506.0" y="876" class="small">Branch ownership</text></svg>