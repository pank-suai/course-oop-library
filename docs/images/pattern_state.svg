    .pill { fill: #17324d; }
    .pill-text { fill: #ffffff; font-size: 13px; font-weight: 700; letter-spacing: .7px; }
  </style>
</defs><rect width="1600" height="900" fill="#fbfdff"/><text x="64" y="54" class="title">Pattern · State</text><text x="64" y="82" class="subtitle">Loan behavior changes with its current state; transitions are explicit and testable.</text><line x1="64" y1="106" x2="1536" y2="106" stroke="#c8d7e0" stroke-width="1.5"/><text x="95" y="155" class="section">OWNER</text><text x="525" y="155" class="section">STATE MACHINE</text><path d="M310,380 L475,380" class="line" marker-end="url(#arrow)"/><text x="392" y="364" class="small" text-anchor="middle">delegates transition</text><path d="M745,300 L945,300" class="line" marker-end="url(#arrow)"/><path d="M650,355 C610,430 610,535 700,570" class="line" marker-end="url(#arrow)"/><path d="M1040,355 C1100,430 1100,535 1010,570" class="line" marker-end="url(#arrow)"/><text x="845" y="284" class="small" text-anchor="middle">deadline passed</text><text x="602" y="468" class="small">return()</text><text x="1110" y="468" class="small">return()</text><rect x="95" y="300" width="215" height="160" rx="14" class="rose"/><text x="202.5" y="332" class="node-title" text-anchor="middle">Loan</text><text x="202.5" y="357" class="node-sub" text-anchor="middle">owns current state</text><rect x="120" y="385" width="165" height="46" rx="9" class="soft"/><text x="202" y="415" class="mono" text-anchor="middle">state: LoanState</text><rect x="475" y="235" width="270" height="120" rx="14" class="storage"/><text x="610.0" y="267" class="node-title" text-anchor="middle">Active</text><text x="610.0" y="292" class="node-sub" text-anchor="middle">issued · due date set</text><rect x="945" y="235" width="270" height="120" rx="14" class="accent"/><text x="1080.0" y="267" class="node-title" text-anchor="middle">Overdue</text><text x="1080.0" y="292" class="node-sub" text-anchor="middle">deadline exceeded</text><rect x="700" y="570" width="310" height="120" rx="14" class="domain"/><text x="855.0" y="602" class="node-title" text-anchor="middle">Returned</text><text x="855.0" y="627" class="node-sub" text-anchor="middle">terminal state</text><rect x="475" y="745" width="740" height="60" rx="12" class="note"/><text x="505" y="782" class="label">Valid transitions: Active → Overdue → Returned   |   Active → Returned</text><text x="800" y="845" class="small" text-anchor="middle">State objects guard legal loan transitions instead of scattering status checks.</text><line x1="64" y1="846" x2="1536" y2="846" stroke="#c8d7e0" stroke-width="1.2"/><rect x="64" y="864" width="14" height="14" rx="3" fill="#fff0ef" stroke="#17324d" stroke-width="1"/><text x="86" y="876" class="small">State owner</text><rect x="197.0" y="864" width="14" height="14" rx="3" fill="#edf8f2" stroke="#17324d" stroke-width="1"/><text x="219.0" y="876" class="small">Active</text><rect x="295.0" y="864" width="14" height="14" rx="3" fill="#fff5df" stroke="#17324d" stroke-width="1"/><text x="317.0" y="876" class="small">Overdue</text><rect x="400.0" y="864" width="14" height="14" rx="3" fill="#e9f4fb" stroke="#17324d" stroke-width="1"/><text x="422.0" y="876" class="small">Returned</text></svg>