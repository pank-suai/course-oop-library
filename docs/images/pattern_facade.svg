</defs><rect width="1600" height="900" fill="#fbfdff"/><text x="64" y="54" class="title">Pattern · Facade</text><text x="64" y="82" class="subtitle">LibraryService exposes cohesive user scenarios and hides multi-repository coordination.</text><line x1="64" y1="106" x2="1536" y2="106" stroke="#c8d7e0" stroke-width="1.5"/><text x="100" y="155" class="section">CLIENTS</text><text x="580" y="155" class="section">FACADE</text><text x="1080" y="155" class="section">COLLABORATORS</text><path d="M350,255 L520,255" class="line" marker-end="url(#arrow)"/><path d="M350,405 L520,405" class="line" marker-end="url(#arrow)"/><path d="M350,555 L520,555" class="line" marker-end="url(#arrow)"/><path d="M900,270 L1060,210" class="line" marker-end="url(#arrow)"/><path d="M900,350 L1060,350" class="line" marker-end="url(#arrow)"/><path d="M900,430 L1060,490" class="line" marker-end="url(#arrow)"/><path d="M900,510 L1060,630" class="line" marker-end="url(#arrow)"/><path d="M700,600 C700,670 940,730 1160,730" class="dash" marker-end="url(#arrow)"/><text x="435" y="238" class="small" text-anchor="middle">one call</text><text x="980" y="230" class="small" text-anchor="middle">coordinates</text><text x="935" y="700" class="small" text-anchor="middle">transaction boundary</text><rect x="100" y="205" width="250" height="100" rx="14" class="domain"/><text x="225.0" y="237" class="node-title" text-anchor="middle">ReadersScreen</text><text x="225.0" y="262" class="node-sub" text-anchor="middle">registerReader()</text><rect x="100" y="355" width="250" height="100" rx="14" class="domain"/><text x="225.0" y="387" class="node-title" text-anchor="middle">BooksScreen</text><text x="225.0" y="412" class="node-sub" text-anchor="middle">search / add</text><rect x="100" y="505" width="250" height="100" rx="14" class="domain"/><text x="225.0" y="537" class="node-title" text-anchor="middle">LoansScreen</text><text x="225.0" y="562" class="node-sub" text-anchor="middle">issue / return</text><rect x="520" y="205" width="380" height="420" rx="14" class="control"/><text x="710.0" y="237" class="node-title" text-anchor="middle">LibraryService</text><text x="710.0" y="262" class="node-sub" text-anchor="middle">Facade / application service</text><rect x="565" y="285" width="290" height="58" rx="9" class="soft"/><text x="710" y="321" class="mono" text-anchor="middle">registerReader()</text><rect x="565" y="365" width="290" height="58" rx="9" class="soft"/><text x="710" y="401" class="mono" text-anchor="middle">addPublication()</text><rect x="565" y="445" width="290" height="58" rx="9" class="soft"/><text x="710" y="481" class="mono" text-anchor="middle">issueLoan()</text><rect x="565" y="525" width="290" height="58" rx="9" class="soft"/><text x="710" y="561" class="mono" text-anchor="middle">returnLoan()</text><rect x="1060" y="155" width="330" height="100" rx="14" class="storage"/><text x="1225.0" y="187" class="node-title" text-anchor="middle">ReaderRepository</text><text x="1225.0" y="212" class="node-sub" text-anchor="middle">save · find · delete</text><rect x="1060" y="300" width="330" height="100" rx="14" class="storage"/><text x="1225.0" y="332" class="node-title" text-anchor="middle">PublicationRepository</text><text x="1225.0" y="357" class="node-sub" text-anchor="middle">availability check</text><rect x="1060" y="445" width="330" height="100" rx="14" class="storage"/><text x="1225.0" y="477" class="node-title" text-anchor="middle">LoanRepository</text><text x="1225.0" y="502" class="node-sub" text-anchor="middle">record · history</text><rect x="1060" y="590" width="330" height="100" rx="14" class="accent"/><text x="1225.0" y="622" class="node-title" text-anchor="middle">LoanPolicy</text><text x="1225.0" y="647" class="node-sub" text-anchor="middle">rule selection</text><rect x="1060" y="710" width="330" height="72" rx="14" class="storage"/><text x="1225.0" y="742" class="node-title" text-anchor="middle">Room transaction</text><text x="1225.0" y="767" class="node-sub" text-anchor="middle">atomic commit</text><text x="800" y="815" class="label" text-anchor="middle">Facade hides coordination: validate → apply policy → persist related changes atomically.</text><line x1="64" y1="846" x2="1536" y2="846" stroke="#c8d7e0" stroke-width="1.2"/><rect x="64" y="864" width="14" height="14" rx="3" fill="#e9f4fb" stroke="#17324d" stroke-width="1"/><text x="86" y="876" class="small">UI client</text><rect x="183.0" y="864" width="14" height="14" rx="3" fill="#f0edfa" stroke="#17324d" stroke-width="1"/><text x="205.0" y="876" class="small">Facade / service</text><rect x="351.0" y="864" width="14" height="14" rx="3" fill="#edf8f2" stroke="#17324d" stroke-width="1"/><text x="373.0" y="876" class="small">Repository collaborator</text><rect x="568.0" y="864" width="14" height="14" rx="3" fill="#fff5df" stroke="#17324d" stroke-width="1"/><text x="590.0" y="876" class="small">Policy collaborator</text></svg>