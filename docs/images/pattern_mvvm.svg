</defs><rect width="1600" height="900" fill="#fbfdff"/><text x="64" y="54" class="title">Pattern · MVVM</text><text x="64" y="82" class="subtitle">Compose screens render state; ViewModels translate events into LibraryService calls.</text><line x1="64" y1="106" x2="1536" y2="106" stroke="#c8d7e0" stroke-width="1.5"/><text x="98" y="150" class="section">VIEW</text><text x="620" y="150" class="section">VIEWMODEL</text><text x="1130" y="150" class="section">APPLICATION</text><path d="M385,255 L565,255" class="line" marker-end="url(#arrow)"/><path d="M885,255 L1055,255" class="line" marker-end="url(#arrow)"/><path d="M385,405 L565,405" class="line" marker-end="url(#arrow)"/><path d="M885,405 L1055,405" class="line" marker-end="url(#arrow)"/><path d="M385,555 L565,555" class="line" marker-end="url(#arrow)"/><path d="M885,555 L1055,555" class="line" marker-end="url(#arrow)"/><path d="M565,290 L385,290" class="observe" marker-end="url(#arrow)"/><path d="M1055,290 L885,290" class="observe" marker-end="url(#arrow)"/><path d="M565,440 L385,440" class="observe" marker-end="url(#arrow)"/><path d="M1055,440 L885,440" class="observe" marker-end="url(#arrow)"/><path d="M565,590 L385,590" class="observe" marker-end="url(#arrow)"/><path d="M1055,590 L885,590" class="observe" marker-end="url(#arrow)"/><text x="475" y="240" class="small" text-anchor="middle">user intent</text><text x="475" y="322" class="small" text-anchor="middle">UiState observed</text><text x="975" y="240" class="small" text-anchor="middle">commands</text><text x="975" y="472" class="small" text-anchor="middle">domain results</text><rect x="100" y="205" width="285" height="100" rx="14" class="domain"/><text x="242.5" y="237" class="node-title" text-anchor="middle">ReadersScreen</text><text x="242.5" y="262" class="node-sub" text-anchor="middle">Compose UI</text><rect x="100" y="355" width="285" height="100" rx="14" class="domain"/><text x="242.5" y="387" class="node-title" text-anchor="middle">PublicationsScreen</text><text x="242.5" y="412" class="node-sub" text-anchor="middle">Compose UI</text><rect x="100" y="505" width="285" height="100" rx="14" class="domain"/><text x="242.5" y="537" class="node-title" text-anchor="middle">LoansScreen</text><text x="242.5" y="562" class="node-sub" text-anchor="middle">Compose UI</text><rect x="565" y="205" width="320" height="100" rx="14" class="control"/><text x="725.0" y="237" class="node-title" text-anchor="middle">ReadersViewModel</text><text x="725.0" y="262" class="node-sub" text-anchor="middle">StateFlow&lt;ReaderUiState&gt;</text><rect x="565" y="355" width="320" height="100" rx="14" class="control"/><text x="725.0" y="387" class="node-title" text-anchor="middle">PublicationsViewModel</text><text x="725.0" y="412" class="node-sub" text-anchor="middle">StateFlow&lt;PublicationUiState&gt;</text><rect x="565" y="505" width="320" height="100" rx="14" class="control"/><text x="725.0" y="537" class="node-title" text-anchor="middle">LoansViewModel</text><text x="725.0" y="562" class="node-sub" text-anchor="middle">StateFlow&lt;LoanUiState&gt;</text><rect x="1055" y="330" width="360" height="150" rx="14" class="accent"/><text x="1235.0" y="362" class="node-title" text-anchor="middle">LibraryService</text><text x="1235.0" y="387" class="node-sub" text-anchor="middle">issue · return · search</text><rect x="1055" y="205" width="360" height="80" rx="14" class="soft"/><text x="1235" y="238" class="node-title" text-anchor="middle">UiEvent</text><text x="1235" y="265" class="node-sub" text-anchor="middle">clicks / form submissions</text><path d="M885,255 C950,255 985,245 1055,245" class="line" marker-end="url(#arrow)"/><path d="M885,405 L1055,405" class="line" marker-end="url(#arrow)"/><path d="M885,555 C950,555 985,455 1055,455" class="line" marker-end="url(#arrow)"/><text x="760" y="760" class="label" text-anchor="middle">One ViewModel owns screen state; the service owns business scenarios.</text><line x1="64" y1="846" x2="1536" y2="846" stroke="#c8d7e0" stroke-width="1.2"/><rect x="64" y="864" width="14" height="14" rx="3" fill="#e9f4fb" stroke="#17324d" stroke-width="1"/><text x="86" y="876" class="small">View layer</text><rect x="190.0" y="864" width="14" height="14" rx="3" fill="#f0edfa" stroke="#17324d" stroke-width="1"/><text x="212.0" y="876" class="small">ViewModel state</text><rect x="351.0" y="864" width="14" height="14" rx="3" fill="#fff5df" stroke="#17324d" stroke-width="1"/><text x="373.0" y="876" class="small">Application service</text><rect x="540.0" y="864" width="14" height="14" rx="3" fill="#ffffff" stroke="#17324d" stroke-width="1"/><text x="562.0" y="876" class="small">Dashed arrow = observation</text></svg>