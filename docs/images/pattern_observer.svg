  </style>
</defs><rect width="1600" height="900" fill="#fbfdff"/><text x="64" y="54" class="title">Pattern · Observer</text><text x="64" y="82" class="subtitle">Room Flow becomes ViewModel StateFlow; multiple Compose screens react to the same change stream.</text><line x1="64" y1="106" x2="1536" y2="106" stroke="#c8d7e0" stroke-width="1.5"/><text x="90" y="155" class="section">SOURCE</text><text x="500" y="155" class="section">PROPAGATION</text><text x="1120" y="155" class="section">OBSERVERS</text><path d="M330,330 L495,330" class="line" marker-end="url(#arrow)"/><path d="M790,330 L955,330" class="line" marker-end="url(#arrow)"/><path d="M1150,255 C1080,215 1030,215 955,255" class="observe" marker-end="url(#arrow)"/><path d="M1150,405 C1080,370 1030,370 955,370" class="observe" marker-end="url(#arrow)"/><path d="M1150,555 C1080,520 1030,520 955,485" class="observe" marker-end="url(#arrow)"/><text x="412" y="314" class="small" text-anchor="middle">Flow&lt;List&lt;PublicationEntity&gt;&gt;</text><text x="872" y="314" class="small" text-anchor="middle">StateFlow&lt;UiState&gt;</text><text x="1070" y="205" class="small" text-anchor="middle">collectAsState()</text><rect x="90" y="260" width="240" height="140" rx="14" class="storage"/><text x="210.0" y="292" class="node-title" text-anchor="middle">PublicationDao</text><text x="210.0" y="317" class="node-sub" text-anchor="middle">Room 3</text><rect x="495" y="255" width="295" height="150" rx="14" class="storage"/><text x="642.5" y="287" class="node-title" text-anchor="middle">PublicationRepository</text><text x="642.5" y="312" class="node-sub" text-anchor="middle">maps + exposes Flow</text><rect x="955" y="255" width="300" height="230" rx="14" class="control"/><text x="1105.0" y="287" class="node-title" text-anchor="middle">LibraryViewModel</text><text x="1105.0" y="312" class="node-sub" text-anchor="middle">MutableStateFlow</text><rect x="1150" y="175" width="330" height="100" rx="14" class="domain"/><text x="1315.0" y="207" class="node-title" text-anchor="middle">PublicationsScreen</text><text x="1315.0" y="232" class="node-sub" text-anchor="middle">observer</text><rect x="1150" y="325" width="330" height="100" rx="14" class="domain"/><text x="1315.0" y="357" class="node-title" text-anchor="middle">ReadersScreen</text><text x="1315.0" y="382" class="node-sub" text-anchor="middle">observer</text><rect x="1150" y="475" width="330" height="100" rx="14" class="domain"/><text x="1315.0" y="507" class="node-title" text-anchor="middle">LoansScreen</text><text x="1315.0" y="532" class="node-sub" text-anchor="middle">observer</text><rect x="90" y="520" width="700" height="110" rx="14" class="note"/><text x="120" y="555" class="node-title">Change event</text><text x="120" y="584" class="body">INSERT / UPDATE / DELETE in SQLite</text><text x="120" y="610" class="body">→ DAO Flow emits → ViewModel updates → screens recompose</text><line x1="80" y1="690" x2="1480" y2="690" class="observe"/><text x="800" y="730" class="label" text-anchor="middle">Dashed arrows are observation subscriptions; no screen polls the database.</text><text x="800" y="805" class="node-title" text-anchor="middle">Observer = automatic propagation of persistence changes into UI state</text><line x1="64" y1="846" x2="1536" y2="846" stroke="#c8d7e0" stroke-width="1.2"/><rect x="64" y="864" width="14" height="14" rx="3" fill="#edf8f2" stroke="#17324d" stroke-width="1"/><text x="86" y="876" class="small">Persistence source</text><rect x="246.0" y="864" width="14" height="14" rx="3" fill="#f0edfa" stroke="#17324d" stroke-width="1"/><text x="268.0" y="876" class="small">State holder</text><rect x="386.0" y="864" width="14" height="14" rx="3" fill="#e9f4fb" stroke="#17324d" stroke-width="1"/><text x="408.0" y="876" class="small">Observer / UI</text><rect x="533.0" y="864" width="14" height="14" rx="3" fill="#ffffff" stroke="#17324d" stroke-width="1"/><text x="555.0" y="876" class="small">Dashed = observe</text></svg>