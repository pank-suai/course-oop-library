</defs><rect width="1600" height="900" fill="#fbfdff"/><text x="64" y="54" class="title">Pattern · Repository</text><text x="64" y="82" class="subtitle">Domain logic calls stable repository interfaces; Room implementations stay behind the boundary.</text><line x1="64" y1="106" x2="1536" y2="106" stroke="#c8d7e0" stroke-width="1.5"/><rect x="54" y="132" width="1492" height="628" rx="20" fill="#f7fbfd" stroke="#b6cbd5" stroke-width="1.5"/><text x="82" y="166" class="section">DOMAIN BOUNDARY</text><text x="850" y="166" class="section">PERSISTENCE ADAPTERS</text><path d="M315,330 L430,330" class="line" marker-end="url(#arrow)"/><path d="M890,330 L780,330" class="dash" marker-end="url(#openArrow)"/><path d="M1230,330 L1370,330" class="line" marker-end="url(#arrow)"/><path d="M660,480 C660,550 660,595 660,640" class="dash" marker-end="url(#openArrow)"/><path d="M1050,480 C1050,550 1050,595 1050,640" class="dash" marker-end="url(#openArrow)"/><path d="M1440,480 C1440,550 1320,600 1240,640" class="line" marker-end="url(#arrow)"/><text x="810" y="316" class="small" text-anchor="middle">implements interface</text><text x="1040" y="580" class="small">maps to DAO</text><text x="1200" y="625" class="small">queries</text><rect x="90" y="270" width="225" height="120" rx="14" class="control"/><text x="202.5" y="302" class="node-title" text-anchor="middle">LibraryService</text><text x="202.5" y="327" class="node-sub" text-anchor="middle">uses repositories</text><rect x="430" y="235" width="350" height="250" rx="14" class="domain"/><text x="605.0" y="267" class="node-title" text-anchor="middle">Repository interfaces</text><text x="605.0" y="292" class="node-sub" text-anchor="middle">domain-facing boundary</text><rect x="462" y="305" width="286" height="48" rx="9" class="soft"/><text x="605" y="335" class="mono" text-anchor="middle">ReaderRepository</text><rect x="462" y="365" width="286" height="48" rx="9" class="soft"/><text x="605" y="395" class="mono" text-anchor="middle">PublicationRepository</text><rect x="462" y="425" width="286" height="48" rx="9" class="soft"/><text x="605" y="455" class="mono" text-anchor="middle">LoanRepository</text><rect x="890" y="235" width="340" height="250" rx="14" class="storage"/><text x="1060.0" y="267" class="node-title" text-anchor="middle">Room repositories</text><text x="1060.0" y="292" class="node-sub" text-anchor="middle">maps records ↔ domain</text><rect x="922" y="305" width="276" height="48" rx="9" class="soft"/><text x="1060" y="335" class="mono" text-anchor="middle">RoomReaderRepository</text><rect x="922" y="365" width="276" height="48" rx="9" class="soft"/><text x="1060" y="395" class="mono" text-anchor="middle">RoomPublicationRepository</text><rect x="922" y="425" width="276" height="48" rx="9" class="soft"/><text x="1060" y="455" class="mono" text-anchor="middle">RoomLoanRepository</text><rect x="1370" y="270" width="150" height="120" rx="14" class="storage"/><text x="1445.0" y="302" class="node-title" text-anchor="middle">Room DAO</text><text x="1445.0" y="327" class="node-sub" text-anchor="middle">Flow / suspend</text><rect x="500" y="640" width="320" height="92" rx="14" class="storage"/><text x="660.0" y="672" class="node-title" text-anchor="middle">ReaderDao · PublicationDao</text><text x="660.0" y="697" class="node-sub" text-anchor="middle">typed SQL access</text><rect x="890" y="640" width="320" height="92" rx="14" class="storage"/><text x="1050.0" y="672" class="node-title" text-anchor="middle">LoanDao · LibraryDatabase</text><text x="1050.0" y="697" class="node-sub" text-anchor="middle">Room 3 / SQLite</text><text x="800" y="802" class="label" text-anchor="middle">Repository keeps domain code independent of Room and storage details.</text><line x1="64" y1="846" x2="1536" y2="846" stroke="#c8d7e0" stroke-width="1.2"/><rect x="64" y="864" width="14" height="14" rx="3" fill="#e9f4fb" stroke="#17324d" stroke-width="1"/><text x="86" y="876" class="small">Domain abstraction</text><rect x="246.0" y="864" width="14" height="14" rx="3" fill="#f0edfa" stroke="#17324d" stroke-width="1"/><text x="268.0" y="876" class="small">Application service</text><rect x="435.0" y="864" width="14" height="14" rx="3" fill="#edf8f2" stroke="#17324d" stroke-width="1"/><text x="457.0" y="876" class="small">Room adapter / database</text></svg>