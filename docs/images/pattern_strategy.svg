ass="node-title" text-anchor="middle">PeriodicalLoanPolicy</text><text x="1230.0" y="522" class="node-sub" text-anchor="middle">reference rules · 7 days</text><rect x="1430" y="180" width="120" height="130" rx="14" class="accent"/><text x="1490.0" y="212" class="node-title" text-anchor="middle">Loan</text><text x="1490.0" y="237" class="node-sub" text-anchor="middle">created</text><rect x="1430" y="470" width="120" height="130" rx="14" class="accent"/><text x="1490.0" y="502" class="node-title" text-anchor="middle">Loan</text><text x="1490.0" y="527" class="node-sub" text-anchor="middle">created</text><rect x="80" y="650" width="1470" height="92" rx="14" class="note"/><text x="110" y="685" class="node-title">Why Strategy?</text><text x="110" y="713" class="body">LibraryService stays unchanged when rules for a new publication type are added.</text><text x="800" y="805" class="label" text-anchor="middle">Same operation · interchangeable policy · different lending decision</text><line x1="64" y1="846" x2="1536" y2="846" stroke="#c8d7e0" stroke-width="1.2"/><rect x="64" y="864" width="14" height="14" rx="3" fill="#f0edfa" stroke="#17324d" stroke-width="1"/><text x="86" y="876" class="small">Client / service</text><rect x="232.0" y="864" width="14" height="14" rx="3" fill="#e9f4fb" stroke="#17324d" stroke-width="1"/><text x="254.0" y="876" class="small">Strategy abstraction</text><rect x="428.0" y="864" width="14" height="14" rx="3" fill="#ffffff" stroke="#17324d" stroke-width="1"/><text x="450.0" y="876" class="small">Concrete strategies</text><rect x="617.0" y="864" width="14" height="14" rx="3" fill="#fff5df" stroke="#17324d" stroke-width="1"/><text x="639.0" y="876" class="small">Resulting entity</text></svg>