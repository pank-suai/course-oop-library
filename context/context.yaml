kind: course_project
title: "Разработка настольного приложения для организации взаимодействия объектов библиотечной информационной системы"
subject: "Объектно-ориентированное программирование"
variant: "Предметная область «Библиотека» (примерная тема 6); без алгоритмических ограничений старого задания"
objective: "Разработать и протестировать настольное графическое приложение, демонстрирующее взаимодействие иерархии классов библиотечной предметной области с применением принципов ООП и шаблонов проектирования."
author: "В. Д. Панков"
group: "М412"
university: "Санкт-Петербургский государственный университет аэрокосмического приборостроения"
department: "Кафедра компьютерных технологий и программной инженерии"
teacher: "Е. О. Шумова"
city: "Санкт-Петербург"
year: 2026
inputs:
  - "Актуальные методические указания по ООП, СПбГУАП, 2026"
  - "Исходный репозиторий https://github.com/pank-suai/course-algs"
  - "Предметная область «Библиотека» и существующий Compose Desktop UI как прототип"
requirements:
  - id: R01
    text: "Разработать иерархию классов предметной области."
  - id: R02
    text: "Использовать не менее пяти классов сущностей."
  - id: R03
    text: "Реализовать обязательную многозначную зависимость."
  - id: R04
    text: "Использовать и обосновать шаблоны проектирования."
  - id: R05
    text: "Разработать графическое тестовое приложение."
  - id: R06
    text: "Не разрабатывать веб-приложение; результат должен быть Desktop JVM-only."
  - id: R07
    text: "Выделить сущностные, управляющие и интерфейсные классы."
  - id: R08
    text: "Подготовить диаграммы сущностей, каждого паттерна и общую диаграмму классов."
  - id: R09
    text: "Протестировать классы и продемонстрировать функциональные сценарии."
  - id: R12
    text: "Сохранять данные между запусками в локальной SQLite-базе через Room 3."
  - id: R13
    text: "Не использовать искусственные форматы шифров/билетов и самописные структуры данных прежнего курса."
  - id: R10
    text: "Подготовить пояснительную записку установленной структуры."
  - id: R11
    text: "Подготовить презентацию PowerPoint на 10–15 слайдов, шрифт не менее 28 pt."
constraints:
  - "Язык и существующий стек сохраняются: Kotlin, Compose Desktop, Gradle Kotlin DSL."
  - "JS/WASM и GitHub Pages не допускаются в новой версии."
  - "Пользователь не вводит технические идентификаторы; они генерируются приложением."
  - "Room 3 использует BundledSQLiteDriver, DAO с Flow/suspend и проверяемую схему базы."
  - "Тема должна быть согласована с преподавателем; репозиторий не является подтверждением согласования."
  - "Фактические результаты тестов и скриншоты нельзя выдумывать."
  - "Контрольные сроки: 27.09.2026, 11.10.2026, 08.11.2026, 06.12.2026 и 13.12.2026; дата защиты определяется расписанием."
deliverables:
  code:
    - "core/"
    - "app/"
    - "tests via Kotlin source sets"
  report:
    source: "docs/index.typ"
    compiled: "docs/report.pdf"
    report_sections:
      - "Титульный лист"
      - "Задание на курсовое проектирование"
      - "Содержание"
      - "Введение"
      - "1. Постановка задачи"
      - "1.1. Анализ предметной области"
      - "1.2. Формулировка функционала"
      - "2. Разработка классов"
      - "2.1. Классы сущностей"
      - "2.2. Управляющие классы"
      - "2.3. Интерфейсные классы"
      - "2.4. Используемые паттерны проектирования"
      - "2.5. Диаграмма классов"
      - "3. Разработка приложения"
      - "3.1. Разработка интерфейса приложения"
      - "3.2. Реализация методов классов"
      - "3.3. Разработка тестового приложения"
      - "4. Тестирование"
      - "Заключение"
      - "Список использованных источников"
      - "Приложения с полным кодом"
  presentation:
    - "presentation/course-oop-library.pptx"
  evidence:
    - "artifacts/test-results.txt"
    - "artifacts/build-results.txt"
    - "artifacts/program-output.txt"
    - "artifacts/code-results.md"
open_questions:
  - "Формальное согласование темы «Библиотека» с преподавателем Е. О. Шумовой ещё не подтверждено источником."
